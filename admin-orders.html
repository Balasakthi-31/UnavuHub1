<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — UnavuHub Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
<div class="admin-layout" id="appRoot"></div>

<!-- Order Detail Modal -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderDetailBody">
        <!-- Rendered by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteOrderModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <i class="fas fa-triangle-exclamation text-danger" style="font-size:2.5rem;"></i>
        <h5 class="mt-3">Delete this order?</h5>
        <p class="text-muted" style="font-size:.9rem;">This action cannot be undone.</p>
        <input type="hidden" id="deleteOrderId" />
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteOrder()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
<script>
  guardAdmin();
  let filterStatus = 'all';
  let searchQuery  = '';

  function render() {
    let orders = DB.getOrders();
    if (filterStatus !== 'all') orders = orders.filter(o => o.status === filterStatus);
    if (searchQuery) orders = orders.filter(o =>
      o.id.toLowerCase().includes(searchQuery) ||
      o.customerName.toLowerCase().includes(searchQuery) ||
      o.phone.includes(searchQuery)
    );

    const root = document.getElementById('appRoot');
    const allStatuses = ['all','pending','confirmed','preparing','out for delivery','delivered','cancelled'];

    root.innerHTML = buildAdminSidebar('orders') + `
      <div class="admin-main">
        ${buildAdminTopbar('Order Management')}
        <div class="admin-content">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <h1 class="page-title mb-0">Orders <span class="text-muted" style="font-size:1rem;font-weight:400;">(${orders.length})</span></h1>
            <div class="input-group" style="max-width:240px;">
              <span class="input-group-text"><i class="fas fa-search"></i></span>
              <input type="text" class="form-control" placeholder="Search ID, customer…" oninput="onSearch(this.value)" value="${searchQuery}" />
            </div>
          </div>

          <!-- Status filter pills -->
          <div class="d-flex flex-wrap gap-2 mb-3">
            ${allStatuses.map(s => `
              <button class="category-pill${s === filterStatus ? ' active' : ''}" onclick="setFilter('${s}')">
                ${s === 'all' ? 'All Orders' : s.charAt(0).toUpperCase() + s.slice(1)}
              </button>`).join('')}
          </div>

          <div class="table-wrap">
            ${orders.length ? `
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map(order => `
                <tr>
                  <td><span class="fw-bold text-primary">${order.id}</span></td>
                  <td>
                    <div class="fw-semibold">${order.customerName}</div>
                    <div class="text-muted" style="font-size:.78rem;">${order.phone}</div>
                  </td>
                  <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${order.items.map(i => i.name + ' ×' + i.qty).join(', ')}">
                    ${order.items.map(i => `${i.name} ×${i.qty}`).join(', ')}
                  </td>
                  <td class="fw-bold">${UI.formatCurrency(order.total)}</td>
                  <td>${order.paymentMethod}</td>
                  <td>
                    <select class="form-select form-select-sm" style="width:auto;font-size:.8rem;" onchange="changeStatus('${order.id}', this.value)">
                      ${statusOptions(order.status)}
                    </select>
                  </td>
                  <td style="font-size:.82rem;white-space:nowrap;">${UI.formatDate(order.date)}</td>
                  <td>
                    <div class="d-flex gap-1">
                      <button class="table-action-btn text-info" title="View Details" onclick="viewOrder('${order.id}')">
                        <i class="fas fa-eye"></i>
                      </button>
                      <button class="table-action-btn text-danger" title="Delete Order" onclick="openDeleteOrder('${order.id}')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>` : `
            <div class="empty-state">
              <i class="fas fa-receipt"></i>
              <h5>No orders found</h5>
              <p>${filterStatus !== 'all' ? 'No orders with this status.' : 'Customer orders will appear here.'}</p>
            </div>`}
          </div>
        </div>
      </div>`;

    setSidebarActive('orders');
  }

  function onSearch(val) { searchQuery = val.toLowerCase(); render(); }
  function setFilter(s)  { filterStatus = s; render(); }

  function changeStatus(id, status) {
    DB.updateOrderStatus(id, status);
    Toast.show(`Order ${id} status → ${status}`, 'success');
    render();
  }

  function viewOrder(id) {
    const order = DB.getOrderById(id);
    if (!order) return;
    const body  = document.getElementById('orderDetailBody');
    body.innerHTML = `
      <div class="row g-3">
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Order ID</div>
          <div class="fw-bold text-primary">${order.id}</div>
        </div>
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Status</div>
          <div>${UI.statusBadge(order.status)}</div>
        </div>
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Customer</div>
          <div class="fw-semibold">${order.customerName}</div>
          <div class="text-muted">${order.phone}</div>
        </div>
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Payment</div>
          <div>${order.paymentMethod}</div>
        </div>
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Order Date</div>
          <div>${UI.formatDate(order.date)}</div>
        </div>
        <div class="col-sm-6">
          <div class="text-muted" style="font-size:.78rem;font-weight:700;text-transform:uppercase;">Total</div>
          <div class="fw-bold text-primary fs-5">${UI.formatCurrency(order.total)}</div>
        </div>
      </div>
      <hr>
      <div class="fw-bold mb-2">Items Ordered</div>
      <table class="table table-sm table-bordered mb-0">
        <thead>
          <tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr>
        </thead>
        <tbody>
          ${order.items.map(i => `
          <tr>
            <td>${i.name}</td>
            <td>${i.qty}</td>
            <td>${UI.formatCurrency(i.price)}</td>
            <td class="fw-semibold">${UI.formatCurrency(i.price * i.qty)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" class="text-end fw-bold">Total</td>
            <td class="fw-bold text-primary">${UI.formatCurrency(order.total)}</td>
          </tr>
        </tfoot>
      </table>`;
    new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
  }

  function openDeleteOrder(id) {
    document.getElementById('deleteOrderId').value = id;
    new bootstrap.Modal(document.getElementById('deleteOrderModal')).show();
  }
  function confirmDeleteOrder() {
    const id = document.getElementById('deleteOrderId').value;
    DB.deleteOrder(id);
    bootstrap.Modal.getInstance(document.getElementById('deleteOrderModal')).hide();
    Toast.show('Order deleted.', 'warning');
    render();
  }

  render();
</script>
</body>
</html>
