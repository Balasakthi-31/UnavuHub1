<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — UnavuHub Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<div class="admin-layout" id="appRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
<script>
  guardAdmin();

  function render() {
    const stats   = DB.getStats();
    const orders  = DB.getOrders().slice(0, 8);
    const root    = document.getElementById('appRoot');

    root.innerHTML = buildAdminSidebar('dashboard') + `
      <div class="admin-main">
        ${buildAdminTopbar('Dashboard')}
        <div class="admin-content">

          <h1 class="page-title">Dashboard Overview</h1>

          <!-- Stat Cards -->
          <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card stat-orange">
                <div class="stat-icon stat-icon-orange"><i class="fas fa-receipt"></i></div>
                <div class="stat-value">${stats.totalOrders}</div>
                <div class="stat-label">Total Orders</div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card stat-green">
                <div class="stat-icon stat-icon-green"><i class="fas fa-indian-rupee-sign"></i></div>
                <div class="stat-value">₹${Number(stats.revenue).toLocaleString('en-IN')}</div>
                <div class="stat-label">Total Revenue</div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card stat-blue">
                <div class="stat-icon stat-icon-blue"><i class="fas fa-users"></i></div>
                <div class="stat-value">${stats.customers}</div>
                <div class="stat-label">Registered Customers</div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card stat-red">
                <div class="stat-icon stat-icon-red"><i class="fas fa-clock"></i></div>
                <div class="stat-value">${stats.pending}</div>
                <div class="stat-label">Pending Orders</div>
              </div>
            </div>
          </div>

          <!-- Recent Orders -->
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span>Recent Orders</span>
              <a href="admin-orders.html" class="btn btn-sm btn-outline-primary">View All</a>
            </div>
            <div class="table-responsive">
              ${orders.length ? `
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  ${orders.map(o => `
                  <tr>
                    <td><span class="fw-bold text-primary">${o.id}</span></td>
                    <td>
                      <div class="fw-semibold">${o.customerName}</div>
                      <div class="text-muted" style="font-size:.78rem;">${o.phone}</div>
                    </td>
                    <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                      ${o.items.map(i => `${i.name} ×${i.qty}`).join(', ')}
                    </td>
                    <td class="fw-bold">${UI.formatCurrency(o.total)}</td>
                    <td>${o.paymentMethod}</td>
                    <td>${UI.statusBadge(o.status)}</td>
                    <td style="font-size:.82rem;">${UI.formatDate(o.date)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>` : `
              <div class="empty-state">
                <i class="fas fa-receipt"></i>
                <h5>No orders yet</h5>
                <p>Orders will appear here once customers start placing them.</p>
              </div>`}
            </div>
          </div>

          <!-- Quick Links -->
          <div class="row g-3 mt-1">
            <div class="col-md-4">
              <a href="admin-menu.html" class="card text-decoration-none p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon stat-icon-orange"><i class="fas fa-utensils"></i></div>
                <div>
                  <div class="fw-bold">Manage Menu</div>
                  <div class="text-muted" style="font-size:.82rem;">${DB.getMenu().length} items</div>
                </div>
              </a>
            </div>
            <div class="col-md-4">
              <a href="admin-orders.html" class="card text-decoration-none p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon stat-icon-blue"><i class="fas fa-receipt"></i></div>
                <div>
                  <div class="fw-bold">Manage Orders</div>
                  <div class="text-muted" style="font-size:.82rem;">${stats.totalOrders} total</div>
                </div>
              </a>
            </div>
            <div class="col-md-4">
              <a href="admin-customers.html" class="card text-decoration-none p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon stat-icon-green"><i class="fas fa-users"></i></div>
                <div>
                  <div class="fw-bold">Manage Customers</div>
                  <div class="text-muted" style="font-size:.82rem;">${stats.customers} registered</div>
                </div>
              </a>
            </div>
          </div>

        </div>
      </div>`;

    setSidebarActive('dashboard');
  }

  render();
</script>
</body>
</html>
