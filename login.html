<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — UnavuHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Unavu<span>Hub</span></div>
    <h2 class="text-center mb-1" style="font-size:1.4rem;">Welcome back</h2>
    <p class="text-center text-muted mb-4" style="font-size:.9rem;">Login to your account to order food</p>

    <!-- Admin hint -->
    <div class="alert alert-warning py-2 px-3 mb-3" style="font-size:.82rem;border-radius:8px;">
      <strong>Admin:</strong> admin@unavuhub.com / admin123
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          <button type="button" class="input-group-text" id="togglePwd" style="cursor:pointer;">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <div id="errMsg" class="alert alert-danger py-2 d-none"></div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:.9rem;">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script>
  // Redirect if already logged in
  if (DB.isLoggedIn()) {
    window.location.href = DB.isAdmin() ? 'admin-dashboard.html' : 'index.html';
  }

  // Toggle password visibility
  document.getElementById('togglePwd').addEventListener('click', () => {
    const pwd  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { pwd.type = 'password'; icon.className = 'fas fa-eye'; }
  });

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('errMsg');

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.'; errEl.classList.remove('d-none'); return;
    }

    const result = DB.loginUser(email, password);
    if (!result.ok) {
      errEl.textContent = result.msg; errEl.classList.remove('d-none');
    } else {
      errEl.classList.add('d-none');
      Toast.show(`Welcome back, ${result.user.name}! 👋`, 'success');
      setTimeout(() => {
        window.location.href = result.user.role === 'admin' ? 'admin-dashboard.html' : 'index.html';
      }, 900);
    }
  });
</script>
</body>
</html>
