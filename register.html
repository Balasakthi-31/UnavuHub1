<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — UnavuHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:500px;">
    <div class="auth-logo">Unavu<span>Hub</span></div>
    <h2 class="text-center mb-1" style="font-size:1.4rem;">Create your account</h2>
    <p class="text-center text-muted mb-4" style="font-size:.9rem;">Join thousands of food lovers in Chennai</p>

    <form id="registerForm" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="name" placeholder="Priya Rajan" required />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-phone"></i></span>
            <input type="tel" class="form-control" id="phone" placeholder="98765 43210" required />
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Delivery Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
            <textarea class="form-control" id="address" rows="2" placeholder="Flat No, Street, Area, City – PIN" required></textarea>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="confirmPwd" placeholder="Re-enter password" required />
          </div>
        </div>
      </div>

      <div id="errMsg" class="alert alert-danger py-2 mt-3 d-none"></div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-3">
        <i class="fas fa-user-plus me-2"></i>Create Account
      </button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:.9rem;">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script>
  if (DB.isLoggedIn()) window.location.href = 'index.html';

  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const errEl = document.getElementById('errMsg');
    const name  = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const addr  = document.getElementById('address').value.trim();
    const pwd   = document.getElementById('password').value;
    const cpwd  = document.getElementById('confirmPwd').value;

    const showErr = msg => { errEl.textContent = msg; errEl.classList.remove('d-none'); };
    errEl.classList.add('d-none');

    if (!name || !email || !phone || !addr || !pwd) return showErr('All fields are required.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Please enter a valid email address.');
    if (!/^\d{10}$/.test(phone.replace(/\s/g,''))) return showErr('Phone number must be 10 digits.');
    if (pwd.length < 6) return showErr('Password must be at least 6 characters.');
    if (pwd !== cpwd)   return showErr('Passwords do not match.');

    const result = DB.registerUser({ name, email, phone, address: addr, password: pwd });
    if (!result.ok) return showErr(result.msg);

    DB.loginUser(email, pwd);
    Toast.show('Account created! Welcome to UnavuHub 🎉', 'success');
    setTimeout(() => window.location.href = 'index.html', 1000);
  });
</script>
</body>
</html>
